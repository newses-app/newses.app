name: Page problem
description: Something on newses.app is wrong, unclear, out of date, or broken
labels: [bug]
body:
  - type: markdown
    attributes:
      value: For problems with Newses itself, use [`newses-app/newses`](https://github.com/newses-app/newses/issues/new/choose).
  - type: input
    id: url
    attributes:
      label: Page
      description: The page's address, for example `https://newses.app/guide/feeds`
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What's wrong
      description: Quote the text or describe what you see, and what you expected
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and device
      description: For a page that looks or behaves wrong, for example Firefox 140 on Android
