name: Site suggestion
description: A guide, page, or change newses.app should have
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: What you were looking for
      description: The question you had, or the task you were trying to do
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Suggestion
      description: The page or change that would have helped
    validations:
      required: true
